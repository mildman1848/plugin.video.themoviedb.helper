name: CI

on:
  push:
    branches: [main, mildman/headless-libsync]
  pull_request:
    branches: [main, mildman/headless-libsync]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Addon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate addon.xml
        run: xmllint --noout addon.xml

      - name: Validate Python syntax
        run: python -m compileall resources
